  <!-- Architecture Silhouette: Right Tower (Penthouse Spire) -->
  <path d="M74 96V34L98 18V96H74Z" fill="url(#havenGold)" />
  <!-- Right Tower Windows -->
  <rect x="81" y="36" width="8" height="9" rx="2" fill="#0F172A" />
  <rect x="81" y="51" width="8" height="9" rx="2" fill="#0F172A" />
  <rect x="81" y="66" width="8" height="9" rx="2" fill="#0F172A" />
  <rect x="81" y="81" width="8" height="9" rx="2" fill="#0F172A" />

