  <rect x="37" y="50" width="8" height="9" rx="2" fill="#0F172A" />
  <rect x="37" y="65" width="8" height="9" rx="2" fill="#0F172A" />
  <rect x="37" y="80" width="8" height="9" rx="2" fill="#0F172A" />

  <!-- Center Sky-Bridge / Connecting Gallery -->
